[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "nihil-mcp"
version = "0.1.0"
description = "MCP server for Nihil — AI-driven pentest container management"
requires-python = ">=3.12"
dependencies = [
    "mcp>=1.26.0",
    "docker>=7.0.0",
]

[project.optional-dependencies]
nihil = [
    "nihil",
]

[project.scripts]
nihil-mcp = "nihil_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["nihil_mcp"]
